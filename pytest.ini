[pytest]
# Pytest Configuration for PromoTales Bot

# Test Discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output Options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=70
    -p no:warnings

# Coverage Options
[coverage:run]
source = src
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests that may take longer
    selenium: Tests that require Selenium WebDriver
    requires_bot_token: Tests that require TELEGRAM_BOT_TOKEN

# Asyncio Mode
asyncio_mode = auto

# Timeout (in seconds)
timeout = 300
timeout_method = thread
